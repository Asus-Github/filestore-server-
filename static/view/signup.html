<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册 - 文件云盘</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>

<body>
  <main class="auth-page">
    <form class="auth-card" id="signup-form" novalidate>
      <h1>用户注册</h1>
      <p class="sub">创建一个新账号</p>
      <div class="form-alert" id="form-alert" role="alert"></div>

      <div class="field">
        <label for="username">用户名</label>
        <input class="input" id="username" name="username" type="text" autocomplete="username"
          maxlength="32" required autofocus aria-describedby="username-hint">
        <div class="hint" id="username-hint">3~32位, 支持字母、中文、数字、下划线、点和中划线</div>
        <div class="error" id="username-error"></div>
      </div>

      <div class="field">
        <label for="password">密码</label>
        <input class="input" id="password" name="password" type="password" autocomplete="new-password"
          maxlength="64" required aria-describedby="password-hint">
        <div class="hint" id="password-hint">6~64位</div>
        <div class="error" id="password-error"></div>
      </div>

      <div class="field">
        <label for="passwordc">确认密码</label>
        <input class="input" id="passwordc" name="passwordc" type="password" autocomplete="new-password"
          maxlength="64" required>
        <div class="error" id="passwordc-error"></div>
      </div>

      <button class="btn btn-primary btn-block" id="submit-btn" type="submit">注册</button>
      <p class="switch">已有账号? <a href="/static/view/signin.html">去登录</a></p>
    </form>
  </main>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/signup.js"></script>
</body>

</html>
