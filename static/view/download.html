<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>断点下载 - 文件云盘</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>

<body>
  <main class="dl-page" id="dl-page">
    <div class="fname" id="dl-name">正在获取文件信息...</div>
    <div class="muted mono" id="dl-hash"></div>
    <div class="progress lg" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
      aria-labelledby="dl-name" id="dl-progress">
      <div class="bar" id="dl-bar"></div>
    </div>
    <div class="stats">
      <span id="dl-status" role="status" aria-live="polite">准备中</span>
      <span id="dl-detail"></span>
    </div>
    <div class="controls">
      <button class="btn btn-primary" id="dl-toggle" type="button" disabled>暂停</button>
      <button class="btn" id="dl-save" type="button" hidden>重新保存文件</button>
      <a class="btn" id="dl-back" href="/static/view/home.html" hidden>返回文件列表</a>
    </div>
    <p class="muted" style="margin-top:16px;font-size:12px">
      文件按 4MB 分段下载, 可随时暂停/继续, 网络中断后会自动重试; 下载完成后会校验文件完整性。
    </p>
  </main>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/sha1.js"></script>
  <script src="/static/js/download.js"></script>
</body>

</html>
