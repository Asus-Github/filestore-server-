<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上传文件 - 文件云盘</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>

<body>
  <header class="topbar">
    <a class="brand" href="/static/view/home.html"><span class="logo" aria-hidden="true">☁</span>文件云盘</a>
    <div class="user">
      <span class="name" id="top-username"></span>
      <button class="btn btn-sm" id="signout-btn" type="button">退出登录</button>
    </div>
  </header>

  <div class="layout">
    <main class="main" style="max-width:860px;margin:0 auto">
      <section class="card">
        <div class="card-header">
          <h2>上传文件</h2>
          <a class="btn" id="back-btn" href="/static/view/home.html">返回文件列表</a>
        </div>
        <div class="card-body">
          <label class="dropzone" id="dropzone" for="file" tabindex="0">
            <span class="icon" aria-hidden="true">⬆</span>
            <strong>点击选择文件, 或将文件拖拽到此处</strong>
            <span>支持多文件; 已存在的文件秒传, 大文件自动分块上传并支持断点续传</span>
          </label>
          <input class="sr-only" id="file" type="file" name="file" multiple>
          <ul class="tasks" id="tasks" aria-live="polite"></ul>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/sha1.js"></script>
  <script src="/static/js/upload.js"></script>
</body>

</html>
