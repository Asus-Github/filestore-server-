<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的文件 - 文件云盘</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>

<body>
  <header class="topbar">
    <a class="brand" href="/static/view/home.html"><span class="logo" aria-hidden="true">☁</span>文件云盘</a>
    <div class="user">
      <span class="name" id="top-username"></span>
      <button class="btn btn-sm" id="signout-btn" type="button">退出登录</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <section class="card card-body profile" aria-label="用户信息">
        <img src="/static/img/avatar.jpeg" alt="用户头像">
        <div class="uname" id="username">-</div>
        <dl>
          <dt>注册时间</dt>
          <dd id="regtime">-</dd>
          <dt>最近登录</dt>
          <dd id="lastactive">-</dd>
          <dt>文件数量</dt>
          <dd id="filecount">-</dd>
        </dl>
      </section>
    </aside>

    <main class="main">
      <section class="card">
        <div class="card-header">
          <h2>文件列表</h2>
          <div>
            <button class="btn" id="refresh-btn" type="button">刷新</button>
            <a class="btn btn-primary" id="upload-btn" href="/static/view/upload.html">上传文件</a>
          </div>
        </div>
        <div class="table-wrap">
          <table class="files" id="filetbl">
            <thead>
              <tr>
                <th scope="col">文件名</th>
                <th scope="col">大小</th>
                <th scope="col" class="col-hide">上传时间</th>
                <th scope="col" class="col-hide">最近更新</th>
                <th scope="col" style="text-align:right">操作</th>
              </tr>
            </thead>
            <tbody id="file-rows"></tbody>
          </table>
        </div>
        <div class="empty" id="file-empty" hidden>
          <div class="icon" aria-hidden="true">📂</div>
          <p>还没有文件, <a href="/static/view/upload.html">去上传</a></p>
        </div>
        <div class="empty" id="file-loading">
          <span class="spinner" aria-hidden="true"></span> 加载中...
        </div>
        <div class="pager" id="pager" hidden>
          <span id="pager-info"></span>
          <div class="btns">
            <button class="btn btn-sm" id="prev-btn" type="button">上一页</button>
            <button class="btn btn-sm" id="next-btn" type="button">下一页</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/home.js"></script>
</body>

</html>
