<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 文件云盘</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>

<body>
  <main class="auth-page">
    <form class="auth-card" id="signin-form" novalidate>
      <h1>用户登录</h1>
      <p class="sub">登录文件云盘, 管理你的文件</p>
      <div class="form-alert" id="form-alert" role="alert"></div>

      <div class="field">
        <label for="username">用户名</label>
        <input class="input" id="username" name="username" type="text" autocomplete="username"
          maxlength="32" required autofocus>
        <div class="error" id="username-error"></div>
      </div>

      <div class="field">
        <label for="password">密码</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password"
          maxlength="64" required>
        <div class="error" id="password-error"></div>
      </div>

      <button class="btn btn-primary btn-block" id="submit-btn" type="submit">登录</button>
      <p class="switch">还没有账号? <a href="/static/view/signup.html">立即注册</a></p>
    </form>
  </main>

  <script src="/static/js/app.js"></script>
  <script src="/static/js/signin.js"></script>
</body>

</html>
